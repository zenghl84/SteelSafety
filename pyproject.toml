# This repository runs as a Streamlit application from its source directory.
# Runtime dependencies are maintained in requirements.txt.
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".local", ".venv", ".logs"]

[tool.ruff.lint]
# Catch syntax and undefined-name errors without reformatting the v1.8 UI code.
select = ["E9", "F63", "F7", "F82"]
